<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-craft · before and after</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="description" content="The same live page twice: typical glass on the left, blur-craft on the right. Move across it.">
<style>
  :root { --x: 50%; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0a15; overflow: hidden; }
  .stage { position: fixed; inset: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #before { clip-path: inset(0 calc(100% - var(--x)) 0 0); z-index: 2; }

  .cmp-line { position: absolute; top: 0; bottom: 0; left: var(--x); width: 0; z-index: 7; pointer-events: none; }
  .cmp-line::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1.5px; width: 3px; background: #fff; box-shadow: 0 0 6px rgb(0 0 0 / 0.35); }
  .cmp-knob { position: absolute; top: 50%; left: 0; translate: -50% -50%; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgb(0 0 0 / 0.35); }
  .cmp-chev { position: absolute; top: 50%; translate: 0 -50%; color: #fff; font: 600 22px/1 -apple-system, sans-serif; text-shadow: 0 1px 6px rgb(0 0 0 / 0.5); }
  .cmp-chev.l { right: 26px; } .cmp-chev.r { left: 26px; }
  .cmp-capture { position: absolute; inset: 0; z-index: 6; cursor: ew-resize; touch-action: none; outline: none; }   /* touch: JS splits a drag into slide (sideways) and scroll (up/down) */
  .cmp-capture:focus-visible ~ .cmp-line .cmp-knob { outline: 3px solid #c9b2ff; outline-offset: 3px; }   /* keyboard focus shows on the knob */
  .cmp-capture[hidden] { display: none; }
  .cmp-label { position: absolute; top: calc(50% - 48px); white-space: nowrap; padding: 5px 10px; border-radius: 6px; background: rgb(0 0 0 / 0.55); color: #fff; font: 600 12px -apple-system, sans-serif; letter-spacing: 0.02em; pointer-events: none; }
  .cmp-label.l { right: 12px; } .cmp-label.r { left: 12px; }
  @media (max-width: 700px) { .cmp-label small { display: none; } }
  .cmp-label small { font-weight: 400; opacity: 0.85; margin-left: 6px; }
  .cmp-tools { position: absolute; right: 16px; bottom: 16px; z-index: 8; display: flex; gap: 8px; }
  .cmp-tools button, .cmp-tools a { display: inline-flex; align-items: center; min-height: 44px; background: #fff; color: #120e18; border: 0; border-radius: 999px; padding: 8px 16px; font: 600 12px -apple-system, sans-serif; text-decoration: none; cursor: pointer; box-shadow: 0 4px 14px rgb(0 0 0 / 0.35); }
  .cmp-tools button:focus-visible, .cmp-tools a:focus-visible { outline: 3px solid #c9b2ff; outline-offset: 2px; }
  /* Phones: the player dock and the hero copy own the bottom half, so the tools and labels move up, under the nav. */
  @media (max-width: 700px) {
    .cmp-tools { left: 12px; right: 12px; bottom: auto; top: calc(66px + env(safe-area-inset-top, 0px)); justify-content: center; flex-wrap: wrap; }
    .cmp-tools button, .cmp-tools a { padding: 8px 12px; }
    .cmp-label { top: calc(124px + env(safe-area-inset-top, 0px)); }
  }

</style>
</head>
<body>
<div class="stage">
  <iframe id="after" src="examples/?mode=after&embed" title="After: blur-craft"></iframe>
  <iframe id="before" data-src="examples/?mode=before&embed" title="Before: typical glass" style="visibility:hidden"></iframe>

  <div class="cmp-capture" id="cmpCapture" role="slider" tabindex="0" aria-label="Compare: move left and right" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
  <div class="cmp-line"><span class="cmp-chev l">‹</span><span class="cmp-knob"></span><span class="cmp-chev r">›</span><span class="cmp-label l">BEFORE<small>typical glass · 1.91:1, 7 lines fail</small></span><span class="cmp-label r">AFTER<small>blur-craft · 4.6:1, all pass</small></span></div>
  <div class="cmp-tools"><button id="cmpInteract" aria-pressed="false">Interact with the page</button><a href="examples/">Open the full app</a><a href="https://github.com/sridhar-raj/blur-craft">GitHub</a></div>
</div>
<script>
  // Compare slider: the line follows the pointer (mouse hover, touch drag), arrow keys move it, and the
  // capture layer forwards scrolling to both live pages so they stay together.
  (() => {
    const root = document.documentElement, cap = document.getElementById("cmpCapture"), box = cap.parentElement;
    let x = 50;
    const set = (v) => { x = Math.max(0, Math.min(100, v)); root.style.setProperty("--x", x + "%"); cap.setAttribute("aria-valuenow", String(Math.round(x))); };
    const fromEvent = (e) => { const r = box.getBoundingClientRect(); set(((e.clientX - r.left) / r.width) * 100); };
    // Mouse: the line follows the pointer. Touch and pen: a sideways drag moves the line, an up/down drag
    // scrolls both pages (touch-action: none hands every drag to us, so the page never gets stuck).
    let drag = null;
    cap.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse") { fromEvent(e); return; }
      drag = { x: e.clientX, y: e.clientY, lastY: e.clientY, mode: null };
      cap.setPointerCapture(e.pointerId);
    });
    cap.addEventListener("pointermove", (e) => {
      if (e.pointerType === "mouse") { fromEvent(e); return; }
      if (!drag) return;
      if (!drag.mode && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8)
        drag.mode = Math.abs(e.clientX - drag.x) > Math.abs(e.clientY - drag.y) ? "slide" : "scroll";
      if (drag.mode === "slide") fromEvent(e);
      if (drag.mode === "scroll") { scrollBy(drag.lastY - e.clientY); drag.lastY = e.clientY; }
    });
    const endDrag = (e) => { if (drag && !drag.mode) fromEvent(e); drag = null; };   // a tap moves the line there
    cap.addEventListener("pointerup", endDrag);
    cap.addEventListener("pointercancel", () => (drag = null));
    cap.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") { set(x - 4); e.preventDefault(); } if (e.key === "ArrowRight") { set(x + 4); e.preventDefault(); } });
    const frames = [...box.querySelectorAll("iframe")];
    let y = 0;
    function scrollBy(dy) {
      const max = Math.max(...frames.map((f) => { try { return f.contentDocument.documentElement.scrollHeight - f.clientHeight; } catch { return 99999; } }));
      y = Math.max(0, Math.min(max, y + dy));
      for (const f of frames) f.contentWindow.postMessage({ bcScroll: y }, "*");
    }
    cap.addEventListener("wheel", (e) => { e.preventDefault(); scrollBy(e.deltaY); }, { passive: false });
    cap.addEventListener("keydown", (e) => {   // PageUp/PageDown/Space scroll the pages from the slider too
      const step = { PageDown: innerHeight * 0.8, PageUp: -innerHeight * 0.8, " ": innerHeight * 0.8, ArrowDown: 60, ArrowUp: -60 }[e.key];
      if (step) { e.preventDefault(); scrollBy(e.shiftKey && e.key === " " ? -step : step); }
    });
    addEventListener("message", (e) => {            // a page scrolled itself (keyboard, interact mode): follow
      if (typeof e.data?.bcScroll !== "number") return;
      y = e.data.bcScroll;
      for (const f of frames) if (f.contentWindow !== e.source) f.contentWindow.postMessage({ bcScroll: y }, "*");
    });
    const toggle = document.getElementById("cmpInteract");
    toggle?.addEventListener("click", () => {
      const on = cap.hidden = !cap.hidden;
      toggle.textContent = on ? "Back to comparing" : "Interact with the page";
      toggle.setAttribute("aria-pressed", String(on));
    });
    window.__cmpSet = set;

    // Load the "before" copy only after the "after" copy has loaded and the browser is idle: the page no
    // longer fetches and runs the whole example twice before its first paint. Hidden until it's ready.
    const before = document.getElementById("before"), after = document.getElementById("after");
    const idle = window.requestIdleCallback || ((f) => setTimeout(f, 200));
    const loadBefore = () => { if (before.src) return; before.addEventListener("load", () => { before.style.visibility = ""; before.contentWindow.postMessage({ bcScroll: y }, "*"); }, { once: true }); before.src = before.dataset.src; };
    if (after.contentDocument?.readyState === "complete") idle(loadBefore); else after.addEventListener("load", () => idle(loadBefore), { once: true });
  })();

</script>
</body>
</html>
