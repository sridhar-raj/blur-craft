<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-craft · before and after</title>
<meta name="description" content="The same live page twice: typical glass on the left, blur-craft on the right. Drag the divider.">
<style>
  :root { --x: 50%; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0a15; color: #fff; font: 14px/1.4 -apple-system, "Segoe UI", Inter, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #before { clip-path: inset(0 calc(100% - var(--x)) 0 0); z-index: 2; }   /* left of the divider */
  .divider { position: fixed; top: 0; bottom: 0; left: var(--x); width: 0; z-index: 5; }
  .divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.25); }
  .handle { position: absolute; top: 50%; left: 0; translate: -50% -50%; width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #120e18; display: grid; place-items: center; font-weight: 700; cursor: ew-resize; box-shadow: 0 6px 20px rgb(0 0 0 / 0.4); border: 0; touch-action: none; }
  .handle:focus-visible { outline: 3px solid #c9b2ff; outline-offset: 3px; }
  .tag { position: fixed; top: 76px; z-index: 6; padding: 8px 12px; border-radius: 10px; background: #fff; color: #120e18; font-weight: 600; box-shadow: 0 6px 20px rgb(0 0 0 / 0.35); max-width: min(46vw, 330px); pointer-events: none; }
  .tag span { display: block; font-weight: 400; color: #5a5468; font-size: 12px; margin-top: 2px; }
  .tag.left { left: 12px; } .tag.right { right: 12px; text-align: right; }
  .bar { position: fixed; left: 50%; translate: -50% 0; top: 80px; z-index: 6; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .bar a, .bar button { background: #fff; color: #120e18; border: 0; border-radius: 999px; padding: 9px 14px; font: 600 13px -apple-system, sans-serif; text-decoration: none; cursor: pointer; box-shadow: 0 6px 20px rgb(0 0 0 / 0.35); }
  @media (max-width: 700px) { .tag span { display: none; } .tag { top: 64px; } }
</style>
</head>
<body>
<div class="stage">
  <iframe id="after" src="examples/?mode=after&embed" title="After: blur-craft"></iframe>
  <iframe id="before" src="examples/?mode=before&embed" title="Before: typical glass"></iframe>
</div>

<div class="tag left">Before: typical glass<span>flat 15% white, 16px blur · worst contrast 1.91:1, 4 lines fail</span></div>
<div class="tag right">After: blur-craft<span>measured material · worst contrast 5.53:1, all pass</span></div>

<div class="divider" id="divider"><button class="handle" id="handle" aria-label="Move the divider (left and right arrow keys)">⇆</button></div>

<div class="bar">
  <button id="jump">Show the on-air card</button>
  <a href="examples/">Open the full app</a>
  <a href="https://github.com/sridhar-raj/blur-craft">GitHub</a>
</div>

<script>
  const root = document.documentElement, before = document.getElementById("before"), after = document.getElementById("after");
  let x = 50;
  const set = (v) => { x = Math.max(0, Math.min(100, v)); root.style.setProperty("--x", x + "%"); };

  // Drag the divider (mouse, touch, pen). Iframes would swallow the pointer, so capture it on the handle.
  const handle = document.getElementById("handle");
  handle.addEventListener("pointerdown", (e) => { handle.setPointerCapture(e.pointerId); document.body.style.userSelect = "none"; });
  handle.addEventListener("pointermove", (e) => { if (handle.hasPointerCapture(e.pointerId)) set((e.clientX / innerWidth) * 100); });
  handle.addEventListener("pointerup", () => { document.body.style.userSelect = ""; });
  handle.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { set(x - 5); e.preventDefault(); }
    if (e.key === "ArrowRight") { set(x + 5); e.preventDefault(); }
  });

  // Keep both pages scrolled together.
  addEventListener("message", (e) => {
    if (typeof e.data?.bcScroll !== "number") return;
    const other = e.source === before.contentWindow ? after : before;
    other.contentWindow.postMessage({ bcScroll: e.data.bcScroll }, "*");
  });

  // Put the divider through the on-air card, the clearest difference.
  document.getElementById("jump").addEventListener("click", () => {
    for (const f of [before, after]) f.contentWindow.postMessage({ bcScroll: 0 }, "*");
    const card = after.contentDocument?.querySelector(".onair");
    if (card) { const r = card.getBoundingClientRect(); set(((r.left + r.width / 2) / innerWidth) * 100); }
  });
</script>
</body>
</html>
