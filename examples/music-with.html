<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidal Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #07080b;
  --ink-2: #0e1015;
  --text: rgb(255 255 255 / 0.95);
  --text-2: rgb(255 255 255 / 0.62);
  --text-3: rgb(255 255 255 / 0.4);
  --accent: #ffb04a;
  --accent-rgb: 255 176 74;
  --counter-rgb: 40 170 170;
  --gutter: 48px;
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --ui: "Geist", ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--ink); color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--ink);
  color: var(--text);
  font-family: var(--ui);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  overscroll-behavior: none;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }

/* ---------------------------------------------------------------- 8. ambient art backdrop */
.tr-ambient { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.tr-ambient img {
  position: absolute;
  inset: -15%;
  width: 130%; height: 130%;
  object-fit: cover;
  /* the art is pre-blurred once into a small canvas (see washFor); this CSS blur is only the fallback */
  filter: blur(70px) saturate(1.5) brightness(0.62);
  transform: translateZ(0);
  transition: opacity 0.9s ease;
}
.tr-ambient img.is-baked { filter: none; }
.tr-ambient img:not([src]) { display: none; }
.tr-ambient::after {             /* fade the wash into ink so the wall stays the subject */
  content: "";
  position: absolute; inset: 0;
  background:
    linear-gradient(to bottom, rgb(7 8 11 / 0.15) 0%, rgb(7 8 11 / 0.72) 42%, rgb(7 8 11 / 0.9) 100%),
    radial-gradient(80% 60% at 18% 0%, transparent, rgb(7 8 11 / 0.35));
}
.tr-grain {                      /* sibling above the backdrop, never wrapping glass */
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  opacity: 0.07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------------------------------------------------------------- 1c. top bar, extended backdrop */
.tr-bar {
  position: sticky; top: 0; z-index: 30;
  isolation: isolate;
  height: 72px;
  display: flex; align-items: center; gap: 28px;
  padding: 0 var(--gutter);
}
.tr-bar__backdrop {
  position: absolute; inset: 0; height: 200%;
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  background: linear-gradient(to bottom, rgb(7 8 11 / 0.62) 0%, rgb(7 8 11 / 0.42) 50%, transparent 50%);
  -webkit-mask-image: linear-gradient(to bottom, #000 0 50%, transparent 50% 100%);
  mask-image: linear-gradient(to bottom, #000 0 50%, transparent 50% 100%);
  pointer-events: none; z-index: -1;
}
.tr-bar__edge {
  position: absolute; inset: 0; height: 100%;
  transform: translateY(100%);
  -webkit-backdrop-filter: blur(12px) brightness(125%) saturate(140%);
  backdrop-filter: blur(12px) brightness(125%) saturate(140%);
  -webkit-mask-image: linear-gradient(to bottom, #000 0 1px, transparent 1px);
  mask-image: linear-gradient(to bottom, #000 0 1px, transparent 1px);
  pointer-events: none;
  opacity: 0; transition: opacity .3s;
}
.tr-bar.is-scrolled .tr-bar__edge { opacity: 1; }
.tr-logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; white-space: nowrap; }
.tr-logo svg { width: 26px; height: 26px; }
.tr-nav { display: flex; gap: 4px; }
.tr-nav a {
  color: var(--text-2); text-decoration: none; font-weight: 500;
  padding: 8px 14px; border-radius: 999px; transition: color .2s, background .2s;
}
.tr-nav a:hover { color: var(--text); }
.tr-nav a[aria-current] { color: var(--text); background: rgb(255 255 255 / 0.09); }
.tr-search {
  margin-left: auto;
  position: relative;
  width: min(460px, 34vw);
}
.tr-search input {
  width: 100%; height: 44px;
  padding: 0 52px 0 44px;
  border-radius: 999px;
  border: 1px solid rgb(255 255 255 / 0.1);
  background: rgb(255 255 255 / 0.07);      /* plain tint: glass inside the bar's backdrop would go flat */
  outline: none;
  transition: background .2s, border-color .2s, box-shadow .2s;
}
.tr-search input::placeholder { color: var(--text-3); }
.tr-search input:focus { background: rgb(255 255 255 / 0.11); border-color: rgb(var(--accent-rgb) / 0.55); box-shadow: 0 0 0 4px rgb(var(--accent-rgb) / 0.12); }
.tr-search > svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--text-2); pointer-events: none; }
.tr-search kbd {
  position: absolute; right: 12px; top: 50%; translate: 0 -50%;
  font: 500 12px var(--ui); color: var(--text-3);
  border: 1px solid rgb(255 255 255 / 0.14); border-radius: 6px; padding: 2px 7px;
}
.tr-search input:not(:placeholder-shown) ~ kbd { display: none; }
.tr-me { display: flex; align-items: center; gap: 14px; }
.tr-icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); transition: color .2s, background .2s; }
.tr-icon-btn:hover { color: var(--text); background: rgb(255 255 255 / 0.08); }
.tr-icon-btn svg { width: 20px; height: 20px; }
.tr-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: conic-gradient(from 200deg, #ff5a36, #ffd23f, #3bceac, #4361ee, #ff5a36);
  display: grid; place-items: center; font-weight: 600; font-size: 13px; color: #111;
  box-shadow: 0 0 0 2px var(--ink), 0 0 0 3px rgb(255 255 255 / 0.2);
}

/* ---------------------------------------------------------------- page */
main { position: relative; z-index: 2; padding: 18px var(--gutter) 200px; }
.tr-hello { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
.tr-hello h1 {
  margin: 0; font-family: var(--display); font-weight: 700;
  font-size: clamp(32px, 3.2vw, 52px); letter-spacing: -0.035em; line-height: 1;
}
.tr-hello h1 span { display: inline-block; white-space: pre; }
.tr-hello h1 em { font-style: normal; color: rgb(var(--accent-rgb)); transition: color .8s; }
.tr-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.tr-chip {
  height: 34px; padding: 0 14px; border-radius: 999px;
  background: rgb(255 255 255 / 0.07); color: var(--text-2); font-weight: 500;
  border: 1px solid rgb(255 255 255 / 0.08);
  transition: background .2s, color .2s;
}
.tr-chip:hover { color: var(--text); background: rgb(255 255 255 / 0.12); }
.tr-chip[aria-pressed="true"] { background: var(--text); color: #0b0b0e; }

.tr-row { margin-bottom: 34px; }
.tr-row__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.tr-row__head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
.tr-row__head a { color: var(--text-3); text-decoration: none; font-weight: 500; font-size: 13px; }
.tr-row__head a:hover { color: var(--text); }

.tr-recent { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 20px; }
.tr-mixes  { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; }
.tr-wall   { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 14px; }

.tr-album { position: relative; text-align: left; min-width: 0; transition: opacity .3s; }
.tr-album.is-dim { opacity: 0.18; }
.tr-art {
  position: relative; display: block; overflow: hidden;
  aspect-ratio: 1; border-radius: 10px;
  box-shadow: 0 1px 0 rgb(255 255 255 / 0.06) inset, 0 18px 40px -18px rgb(0 0 0 / 0.8);
  transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s;
}
.tr-art > svg { width: 100%; height: 100%; }
.tr-album:hover .tr-art { transform: translateY(-4px); box-shadow: 0 1px 0 rgb(255 255 255 / 0.1) inset, 0 28px 50px -18px rgb(0 0 0 / 0.9); }
.tr-album__title { display: block; margin-top: 10px; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-album__by { display: block; margin-top: 2px; color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-album.is-playing .tr-album__title { color: rgb(var(--accent-rgb)); }

/* hover play: small, clear glass over the cover art */
.tr-hover-play {
  position: absolute; right: 10px; bottom: 10px;
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(160deg, rgb(255 255 255 / 0.3), rgb(255 255 255 / 0.1));
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.5), 0 8px 18px -6px rgb(0 0 0 / 0.6);
  opacity: 0; transform: translateY(6px) scale(.94);
  transition: opacity .25s, transform .35s cubic-bezier(.2,.8,.2,1);
}
.tr-hover-play svg { width: 18px; height: 18px; }
.tr-album:hover .tr-hover-play, .tr-album:focus-visible .tr-hover-play {
  opacity: 1; transform: none;
  -webkit-backdrop-filter: blur(16px) saturate(180%);   /* only the hovered cover pays for a backdrop */
  backdrop-filter: blur(16px) saturate(180%);
}
.tr-album:focus-visible { outline: none; }
.tr-album:focus-visible .tr-art { outline: 2px solid rgb(var(--accent-rgb)); outline-offset: 3px; }

.tr-eq { position: absolute; right: 10px; top: 10px; display: none; gap: 3px; align-items: end; height: 18px; padding: 6px 7px; border-radius: 8px; background: rgb(0 0 0 / 0.55); box-sizing: content-box; }
.tr-eq i { width: 3px; background: rgb(var(--accent-rgb)); border-radius: 2px; height: 40%; }
.tr-album.is-playing .tr-eq { display: flex; }

/* mixes: taller cards, label printed on the art */
.tr-mix .tr-art { aspect-ratio: 0.82; border-radius: 14px; }
.tr-mix__label {
  position: absolute; left: 0; right: 0; top: 0;
  padding: 16px 16px 40px;
  background: linear-gradient(to bottom, rgb(0 0 0 / 0.5), transparent);
  pointer-events: none;
}
.tr-mix__kicker { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgb(255 255 255 / 0.75); }
.tr-mix__name { margin-top: 4px; font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.03em; line-height: 1; color: #fff; }
.tr-mix__desc { display: block; margin-top: 10px; color: var(--text-2); font-size: 13px; line-height: 1.4; }

.tr-wall .tr-art { border-radius: 8px; }
.tr-wall .tr-album__title { font-size: 13px; margin-top: 8px; }
.tr-wall .tr-album__by { font-size: 12px; }

/* ---------------------------------------------------------------- 0. light behind the dock */
.tr-dock-light {
  position: fixed; left: 0; right: 0; bottom: 0; height: 300px;
  z-index: 3; pointer-events: none;
  mix-blend-mode: screen;
  background:
    radial-gradient(28% 70% at 30% 100%, rgb(var(--accent-rgb) / 0.55), transparent 70%),
    radial-gradient(20% 55% at 74% 100%, rgb(var(--counter-rgb) / 0.4), transparent 70%);
  transition: background .9s;
}

/* ---------------------------------------------------------------- 1. glass material (assets/glass.css, prefix tr-glass) */
.tr-glass {
  --glass-blur: 30px;
  --glass-sat: 180%;
  --glass-bright: 1.05;
  --glass-fill-top: rgb(255 255 255 / 0.16);
  --glass-fill-bottom: rgb(255 255 255 / 0.04);
  --glass-dim: rgb(10 10 18 / 0.28);
  --glass-light: 255 255 255;
  --glass-radius: 28px;
  --glass-rim-angle: 150deg;
  --glass-rim-hot: 0.6;
  --mx: 30%;
  --my: 0%;
  position: relative;
  isolation: isolate;
  border-radius: var(--glass-radius);
  background:
    linear-gradient(160deg, var(--glass-fill-top), var(--glass-fill-bottom) 60%),
    var(--glass-dim);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  box-shadow:
    inset 0 1px 0 rgb(var(--glass-light) / 0.35),
    inset 0 -1px 0 rgb(255 255 255 / 0.04),
    inset 0 0 32px rgb(var(--glass-light) / 0.06),
    0 1px 2px rgb(0 0 0 / 0.2),
    0 30px 60px -20px rgb(0 0 0 / 0.55);
}
.tr-glass::before {
  content: "";
  position: absolute; inset: 0; z-index: 1;
  padding: 1px; border-radius: inherit; pointer-events: none;
  background: linear-gradient(
    var(--glass-rim-angle),
    rgb(var(--glass-light) / var(--glass-rim-hot)),
    rgb(var(--glass-light) / 0.12) 35%,
    rgb(255 255 255 / 0.04) 60%,
    rgb(var(--glass-light) / 0.22)
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.tr-glass::after {
  content: "";
  position: absolute; inset: 0; z-index: 0;
  border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 80% at var(--mx) var(--my), rgb(var(--glass-light) / 0.14), transparent 55%);
}
.tr-glass > * { position: relative; z-index: 2; }
.tr-glass--clear   { --glass-blur: 16px; --glass-dim: rgb(10 10 18 / 0.10); --glass-fill-top: rgb(255 255 255 / 0.10); }
.tr-glass--regular { --glass-blur: 32px; --glass-dim: rgb(10 10 18 / 0.30); }
.tr-glass .tr-glass-label     { color: rgb(255 255 255 / 0.96); }
.tr-glass .tr-glass-secondary { color: rgb(255 255 255 / 0.68); }
.tr-glass .tr-glass-tertiary  { color: rgb(255 255 255 / 0.45); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .tr-glass { background: radial-gradient(60% 140% at 20% 0%, rgb(var(--glass-light) / 0.14), transparent 70%), linear-gradient(160deg, rgb(48 48 62 / 0.96), rgb(22 22 30 / 0.97)); }
  .tr-bar__backdrop { background: rgb(9 10 14 / 0.94); -webkit-mask-image: none; mask-image: none; height: 100%; }
  .tr-hover-play { background: rgb(20 20 26 / 0.85); }
}
@media (prefers-reduced-transparency: reduce) {
  .tr-glass {
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
    background: radial-gradient(60% 140% at 22% 0%, rgb(var(--glass-light) / 0.16), transparent 70%), linear-gradient(160deg, rgb(34 34 44), rgb(20 20 27)) !important;
  }
  .tr-bar__backdrop { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgb(9 10 14 / 0.96); -webkit-mask-image: none; mask-image: none; height: 100%; }
  .tr-bar__edge { display: none; }
  .tr-hover-play { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgb(20 20 26 / 0.9); }
  .tr-dock-light { opacity: 0.5; }
}

/* ---------------------------------------------------------------- the dock (hero glass, liquid) */
.tr-dock {
  --glass-light: 255 190 130;
  --glass-rim-angle: 105deg;
  --glass-rim-hot: 0.85;
  --glass-radius: 30px;
  --glass-dim: rgb(10 10 18 / 0.36);   /* one notch past regular: the dock sits over the brightest covers */
  position: fixed; z-index: 40;
  left: 0; right: 0; margin: 0 auto; bottom: 22px;   /* no translate: a translated parent with children broke the backdrop blur in Chromium 156 */
  width: min(1120px, calc(100% - 32px));
  height: 96px;
  padding: 0 26px 0 14px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr);
  align-items: center; gap: 28px;
}
.tr-now { display: flex; align-items: center; gap: 14px; min-width: 0; }
.tr-now__art { width: 68px; height: 68px; flex: none; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 24px -8px rgb(0 0 0 / 0.7), inset 0 0 0 1px rgb(255 255 255 / 0.12); }
.tr-now__art svg { width: 100%; height: 100%; }
.tr-now__text { min-width: 0; }
.tr-now__title { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-now__by { font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-like { margin-left: 4px; width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; color: rgb(255 255 255 / 0.68); transition: color .2s, transform .2s; }
.tr-like svg { width: 18px; height: 18px; }
.tr-like[aria-pressed="true"] { color: rgb(var(--accent-rgb)); }
.tr-like:active { transform: scale(.88); }

.tr-transport { display: grid; gap: 8px; }
.tr-buttons { display: flex; align-items: center; justify-content: center; gap: 18px; }
.tr-ctl { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: rgb(255 255 255 / 0.78); transition: color .2s, background .2s, transform .15s; }
.tr-ctl:hover { color: #fff; background: rgb(255 255 255 / 0.1); }
.tr-ctl:active { transform: scale(.9); }
.tr-ctl svg { width: 18px; height: 18px; }
.tr-ctl[aria-pressed="true"] { color: rgb(var(--accent-rgb)); }
.tr-play {
  position: relative;
  width: 46px; height: 46px; border-radius: 50%;
  background: #fff; color: #0b0b0e;
  display: grid; place-items: center;
  box-shadow: 0 6px 18px -4px rgb(0 0 0 / 0.5), 0 0 0 6px rgb(255 255 255 / 0.06);
  transition: transform .2s cubic-bezier(.2,.8,.2,1);
}
.tr-play:hover { transform: scale(1.05); }
.tr-play:active { transform: scale(.94); }
.tr-play svg { position: absolute; width: 20px; height: 20px; transition: opacity .2s cubic-bezier(.2,.8,.2,1), filter .2s cubic-bezier(.2,.8,.2,1), transform .2s cubic-bezier(.2,.8,.2,1); }
/* 4b. blur-bridged crossfade: the leaving icon blurs 2px, the arriving one clears to filter: none */
.tr-play .is-off { opacity: 0; filter: blur(2px); transform: scale(.8); }
.tr-play .is-on  { opacity: 1; filter: none; transform: none; }

.tr-progress { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 10px; font-size: 12px; font-variant-numeric: tabular-nums; }
.tr-progress span:last-child { text-align: right; }
.tr-range {
  --p: 40%;
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 16px; margin: 0; background: transparent; cursor: pointer;
}
.tr-range::-webkit-slider-runnable-track {
  height: 4px; border-radius: 4px;
  background: linear-gradient(to right, rgb(255 255 255 / 0.95) var(--p), rgb(255 255 255 / 0.2) var(--p));
}
.tr-range::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, rgb(255 255 255 / 0.95) var(--p), rgb(255 255 255 / 0.2) var(--p)); }
.tr-range::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgb(0 0 0 / .4); opacity: 0; transition: opacity .2s; }
.tr-range::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; opacity: 0; }
.tr-range:hover::-webkit-slider-thumb, .tr-range:focus-visible::-webkit-slider-thumb { opacity: 1; }
.tr-range:hover::-moz-range-thumb { opacity: 1; }
.tr-range:hover::-webkit-slider-runnable-track { background: linear-gradient(to right, rgb(var(--accent-rgb)) var(--p), rgb(255 255 255 / 0.22) var(--p)); }
.tr-range:focus-visible { outline: none; }

.tr-side { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.tr-vol { display: flex; align-items: center; gap: 8px; width: 160px; }
.tr-vol .tr-range { flex: 1; }
.tr-device { font-size: 12px; display: flex; align-items: center; gap: 6px; margin-right: 6px; white-space: nowrap; }
.tr-device i { width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--accent-rgb)); box-shadow: 0 0 8px rgb(var(--accent-rgb)); }

/* ---------------------------------------------------------------- responsive */
@media (max-width: 1280px) {
  .tr-recent { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .tr-recent > :nth-child(n+7) { display: none; }
  .tr-wall { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .tr-device { display: none; }
}
@media (max-width: 960px) {
  :root { --gutter: 24px; }
  .tr-nav { display: none; }
  .tr-mixes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tr-mixes > :nth-child(n+4) { display: none; }
  .tr-wall { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .tr-dock { grid-template-columns: minmax(0, 1fr) auto; }
  .tr-side { display: none; }
  .tr-transport { display: flex; align-items: center; gap: 10px; }
  .tr-progress { display: none; }
}
@media (max-width: 640px) {
  :root { --gutter: 16px; }
  .tr-bar { gap: 12px; height: 64px; }
  .tr-logo span { display: none; }
  .tr-search { width: auto; flex: 1; margin-left: 0; }
  .tr-search input { height: 40px; padding-right: 14px; font-size: 14px; }
  .tr-search kbd { display: none; }
  .tr-me .tr-icon-btn { display: none; }
  .tr-hello { flex-direction: column; align-items: flex-start; gap: 14px; margin-bottom: 20px; }
  .tr-chips { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .tr-chip { flex: none; }
  .tr-recent, .tr-mixes {

      case "mesh": {
        defs += '<radialGradient id="' + id + 'a"><stop offset="0" stop-color="' + c[1] + '"/><stop offset="1" stop-color="' + c[1] + '" stop-opacity="0"/></radialGradient>';
        defs += '<radialGradient id="' + id + 'b"><stop offset="0" stop-color="' + c[2] + '"/><stop offset="1" stop-color="' + c[2] + '" stop-opacity="0"/></radialGradient>';
        defs += '<radialGradient id="' + id + 'c"><stop offset="0" stop-color="' + c[3] + '"/><stop offset="1" stop-color="' + c[3] + '" stop-opacity="0"/></radialGradient>';
        g += '<rect width="200" height="' + H + '" fill="' + c[0] + '"/>';
        g += '<circle cx="' + (40 + r() * 40) + '" cy="' + H * 0.3 + '" r="120" fill="url(#' + id + 'a)"/>';
        g += '<circle cx="' + (130 + r() * 40) + '" cy="' + H * 0.7 + '" r="110" fill="url(#' + id + 'b)"/>';
        g += '<circle cx="160" cy="' + H * 0.15 + '" r="80" fill="url(#' + id + 'c)"/>';
        if (!al.bare) g += '<text x="14" y="' + (H - 18) + '" font-family="Georgia, serif" font-style="italic" font-size="30" fill="' + c[4] + '">' + esc(al.t) + '</text>';
        break;
      }
      case "arch": {
        g += '<rect width="200" height="' + H + '" fill="' + c[0] + '"/>';
        for (var a = 0; a < 6; a++) {
          var aw = 180 - a * 28, ax = 100 - aw / 2, top = H * 0.22 + a * 14;
          if (aw <= 0) break;
          g += '<path d="M' + ax + ' ' + H + ' L' + ax + ' ' + (top + aw / 2) + ' A' + aw / 2 + ' ' + aw / 2 + ' 0 0 1 ' + (ax + aw) + ' ' + (top + aw / 2) + ' L' + (ax + aw) + ' ' + H + ' Z" fill="' + [c[1], c[3], c[2], c[0], c[1], c[2]][a] + '"/>';
        }
        g += '<circle cx="100" cy="' + (H * 0.22 - 4) + '" r="6" fill="' + c[2] + '"/>';
        break;
      }
      default: { /* checker */
        g += '<rect width="200" height="' + H + '" fill="' + c[0] + '"/><g transform="rotate(45 100 ' + H / 2 + ')">';
        for (var gy = -6; gy < 10; gy++) for (var gx = -6; gx < 10; gx++) if ((gx + gy) % 2 === 0) g += '<rect x="' + gx * 26 + '" y="' + gy * 26 + '" width="26" height="26" fill="' + c[1] + '"/>';
        g += '</g><circle cx="' + (60 + r() * 80) + '" cy="' + H * 0.5 + '" r="38" fill="' + c[2] + '"/><circle cx="' + (60 + r() * 80) + '" cy="' + H * 0.5 + '" r="16" fill="' + c[3] + '"/>';
        g += small;
      }
    }
    return '<svg viewBox="0 0 200 ' + H + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>' + defs + '</defs>' + g + '</svg>';
  }

  /* ------------------------------------------------------------------ render rows */
  var EQ = '<span class="tr-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';
  var HP = '<span class="tr-hover-play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7.5 4.8v14.4a1 1 0 0 0 1.5.86l11.3-7.2a1 1 0 0 0 0-1.72L9 3.94a1 1 0 0 0-1.5.86z"/></svg></span>';
  var all = [];
  function album(al, cls) {
    var b = document.createElement("button");
    b.className = "tr-album " + (cls || "");
    b.setAttribute("aria-label", "Play " + al.t + " by " + al.a);
    b.innerHTML = '<span class="tr-art">' + cover(al) + EQ + HP + '</span><span class="tr-album__title">' + esc(al.t) + '</span><span class="tr-album__by">' + esc(al.a) + '</span>';
    b.addEventListener("click", function () { setTrack(al); });
    al.el = b; all.push(al);
    return b;
  }
  var recentEl = document.getElementById("recent");
  RECENT.forEach(function (al) { recentEl.appendChild(album(al)); });
  var mixEl = document.getElementById("mixes");
  MIXES.forEach(function (m) {
    var al = { t: m.t, a: m.desc.split(",")[0], s: m.s, p: m.p, bare: true };
    var b = document.createElement("button");
    b.className = "tr-album tr-mix";
    b.setAttribute("aria-label", "Play " + m.t);
    b.innerHTML = '<span class="tr-art">' + cover(al, 244) + '<span class="tr-mix__label"><div class="tr-mix__kicker">' + esc(m.k) + '</div><div class="tr-mix__name">' + esc(m.t) + '</div></span>' + EQ + HP + '</span><span class="tr-mix__desc">' + esc(m.desc) + '</span>';
    b.addEventListener("click", function () { setTrack(al); });
    al.el = b; all.push(al);
    mixEl.appendChild(b);
  });
  var wallEl = document.getElementById("wall");
  WALL.forEach(function (al) { wallEl.appendChild(album(al)); });

  /* ------------------------------------------------------------------ blur reveal on the greeting (once) */
  var hello = document.getElementById("hello");
  var words = ["Good", "evening,", "Ada.", "Still", "in", "<em>Low", "Light?</em>"];
  hello.innerHTML = '<span aria-hidden="true">Good </span><span aria-hidden="true">evening, </span><span aria-hidden="true">Ada. </span><span aria-hidden="true">Still </span><span aria-hidden="true">in </span><em><span aria-hidden="true" id="hl1">Low </span><span aria-hidden="true" id="hl2">Light?</span></em>';
  var reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduceMotion && hello.animate) {
    Array.prototype.forEach.call(hello.querySelectorAll("span"), function (s, i) {
      var an = s.animate([{ opacity: 0, transform: "translateY(10px)", filter: "blur(8px)" }, { opacity: 1, transform: "none", filter: "blur(0px)" }],
        { duration: 600, delay: 150 + i * 45, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" });
      an.onfinish = function () { s.style.filter = "none"; };   /* transitionEnd: filter none */
    });
  }

  /* ------------------------------------------------------------------ liquid glass (assets/liquid-glass.ts, as plain JS) */
  function supportsLiquidGlass() {
    if (typeof navigator === "undefined") return false;
    var isChromium = /Chrome\/|Chromium\/|Edg\//.test(navigator.userAgent) && !/Firefox\//.test(navigator.userAgent);
    return isChromium && CSS.supports("backdrop-filter", "blur(1px)");
  }
  function surface(x) { return Math.pow(1 - Math.pow(1 - x, 4), 1 / 4); }
  function displacementMap(w, h, r, bezel) {
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    var ctx = c.getContext("2d");
    var img = ctx.createImageData(w, h);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var qx = Math.max(Math.abs(x + 0.5 - w / 2) - (w / 2 - r), 0);
        var qy = Math.max(Math.abs(y + 0.5 - h / 2) - (h / 2 - r), 0);
        var d, nx, ny;
        if (qx > 0 && qy > 0) {
          var len = Math.hypot(qx, qy);
          d = r - len;
          nx = (qx / len) * Math.sign(x + 0.5 - w / 2);
          ny = (qy / len) * Math.sign(y + 0.5 - h / 2);
        } else {
          var ddx = w / 2 - Math.abs(x + 0.5 - w / 2);
          var ddy = h / 2 - Math.abs(y + 0.5 - h / 2);
          if (ddx < ddy) { d = ddx; nx = Math.sign(x + 0.5 - w / 2); ny = 0; }
          else { d = ddy; nx = 0; ny = Math.sign(y + 0.5 - h / 2); }
        }
        var m = 0;
        if (d >= 0 && d < bezel) {
          var t = d / bezel;
          var slope = (surface(Math.min(1, t + 0.01)) - surface(Math.max(0, t - 0.01))) / 0.02;
          m = Math.min(1, slope / 4);
        }
        var i = (y * w + x) * 4;
        img.data[i] = 128 - nx * m * 127;
        img.data[i + 1] = 128 - ny * m * 127;
        img.data[i + 2] = 128;
        img.data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL();
  }
  var liquidCounter = 0;
  function mountLiquidGlass(el, opts) {
    opts = opts || {};
    if (!supportsLiquidGlass()) return null;
    if (matchMedia("(prefers-reduced-transparency: reduce)").matches) return null;
    var bezel = opts.bezel != null ? opts.bezel : 22, strength = opts.strength != null ? opts.strength : 38;
    var blur = opts.blur != null ? opts.blur : 14, saturate = opts.saturate != null ? opts.saturate : 170;
    var rect = el.getBoundingClientRect();
    var w = Math.round(rect.width), h = Math.round(rect.height);
    var r = opts.radius != null ? opts.radius : (parseFloat(getComputedStyle(el).borderTopLeftRadius) || 24);
    if (!w || !h) return null;
    var id = el.dataset.liquidId || "liquid-glass-" + (++liquidCounter);
    el.dataset.liquidId = id;
    var old = document.getElementById(id + "-svg"); if (old) old.remove();
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.id = id + "-svg";
    svg.setAttribute("width", "0"); svg.setAttribute("height", "0");
    svg.setAttribute("aria-hidden", "true");
    svg.style.position = "absolute";
    svg.innerHTML =
      '<filter id="' + id + '" x="0" y="0" width="' + w + '" height="' + h + '" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">' +
      '<feImage href="' + displacementMap(w, h, Math.min(r, w / 2, h / 2), bezel) + '" x="0" y="0" width="' + w + '" height="' + h + '" result="map" preserveAspectRatio="none"/>' +
      '<feDisplacementMap in="SourceGraphic" in2="map" scale="' + strength + '" xChannelSelector="R" yChannelSelector="G"/>' +
      '</filter>';
    document.body.appendChild(svg);
    /* blur runs BEFORE the displacement: with url() first, Chromium 156 left the lower part of the dock
       unfrosted (text behind it read sharp). Blur-then-bend still shows the bezel bending colour edges. */
    var value = "blur(" + blur + "px) url(#" + id + ") saturate(" + saturate + "%)";
    el.style.setProperty("backdrop-filter", value);
    el.style.setProperty("-webkit-backdrop-filter", value);
    return id;
  }

  var dock = document.getElementById("dock");
  var LIQ = { bezel: 28, strength: 44, blur: 16, saturate: 180 };
  var rz;
  function mountDock() { mountLiquidGlass(dock, LIQ); }
  window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(mountDock, 120); });

  /* pointer sheen */
  dock.addEventListener("pointermove", function (e) {
    var b = dock.getBoundingClientRect();
    dock.style.setProperty("--mx", ((e.clientX - b.left) / b.width * 100).toFixed(1) + "%");
    dock.style.setProperty("--my", ((e.clientY - b.top) / b.height * 100).toFixed(1) + "%");
  });
  dock.addEventListener("pointerleave", function () { dock.style.setProperty("--mx", "30%"); dock.style.setProperty("--my", "0%"); });

  /* ------------------------------------------------------------------ now playing */
  var root = document.documentElement;
  var ambA = document.getElementById("ambA"), ambB = document.getElementById("ambB"), ambFront = ambA;
  var nowArt = document.getElementById("nowArt"), nowTitle = document.getElementById("nowTitle"), nowBy = document.getElementById("nowBy");
  var seek = document.getElementById("seek"), tCur = document.getElementById("tCur"), tDur = document.getElementById("tDur"), mini = document.getElementById("mini");
  var playBtn = document.getElementById("play");
  var current = null, pos = 97, dur = 252, playing = true;

  function svgURI(svg) { return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace('preserveAspectRatio="xMidYMid slice" aria-hidden="true"', 'xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" width="200" height="200"')); }
  /* 8. art backdrop, baked: blur the cover once into a 96px canvas and let the browser scale it up.
     A live CSS blur(70px) on a full-screen image was re-rasterised under the glass every frame (22 fps headless). */
  function washFor(uri, cb) {
    var img = new Image();
    img.onload = function () {
      try {
        var c = document.createElement("canvas"), n = 96;
        c.width = c.height = n;
        var x = c.getContext("2d");
        if ("filter" in x) {
          x.filter = "blur(7px) saturate(1.5) brightness(0.62)";
          x.drawImage(img, -14, -14, n + 28, n + 28);
          cb(c.toDataURL(), true);
        } else cb(uri, false);
      } catch (e) { cb(uri, false); }
    };
    img.onerror = function () { cb(uri, false); };
    img.src = uri;
  }
  function fmt(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function paint() {
    var p = (pos / dur * 100).toFixed(2) + "%";
    seek.max = dur; seek.value = pos; seek.style.setProperty("--p", p);
    mini.style.setProperty("--p", p);
    tCur.textContent = fmt(pos); tDur.textContent = fmt(dur);
  }
  function setTrack(al, first) {
    if (current === al) { togglePlay(); return; }
    if (current && current.el) current.el.classList.remove("is-playing");
    current = al;
    if (al.el) al.el.classList.add("is-playing");
    var lt = LIGHT[al.p];
    root.style.setProperty("--accent-rgb", lt[0]);
    root.style.setProperty("--counter-rgb", lt[1]);
    dock.style.setProperty("--glass-light", lt[0]);
    var svg = cover(al);
    nowArt.innerHTML = svg;
    nowTitle.textContent = al.t; nowBy.textContent = al.a;
    var uri = svgURI(svg);
    washFor(uri, function (src, baked) {
      var el = first ? ambA : (ambFront === ambA ? ambB : ambA);
      el.classList.toggle("is-baked", baked);
      el.src = src;
      if (!first) { el.style.opacity = "1"; ambFront.style.opacity = "0"; ambFront = el; }
    });
    if (!first) { dur = al.d || 160 + (hash(al.t) % 140); pos = 0; setPlaying(true); }
    paint();
  }
  function setPlaying(v) {
    playing = v;
    playBtn.setAttribute("aria-label", v ? "Pause" : "Play");
    playBtn.querySelector('[data-i="pause"]').setAttribute("class", v ? "is-on" : "is-off");
    playBtn.querySelector('[data-i="play"]').setAttribute("class", v ? "is-off" : "is-on");
    document.body.classList.toggle("is-paused", !v);
    eqTick();
  }
  function togglePlay() { setPlaying(!playing); }
  playBtn.addEventListener("click", togglePlay);
  seek.addEventListener("input", function () { pos = +seek.value; paint(); });
  var vol = document.getElementById("vol");
  function paintVol() { vol.style.setProperty("--p", vol.value + "%"); }
  vol.addEventListener("input", paintVol); paintVol();
  var lastVol = 72;
  document.getElementById("mute").addEventListener("click", function () {
    if (+vol.value > 0) { lastVol = +vol.value; vol.value = 0; } else vol.value = lastVol || 60;
    paintVol();
  });
  document.getElementById("like").addEventListener("click", function () {
    var on = this.getAttribute("aria-pressed") !== "true";
    this.setAttribute("aria-pressed", on); this.setAttribute("aria-label", on ? "Saved to library" : "Save to library");
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tr-ctl[aria-pressed]'), function (b) {
    b.addEventListener("click", function () { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); });
  });
  function step(dir) {
    var list = RECENT.concat(WALL), i = list.indexOf(current);
    setTrack(list[(i + dir + list.length) % list.length]);
  }
  document.querySelector('[data-k="next"]').addEventListener("click", function () { step(1); });
  document.querySelector('[data-k="prev"]').addEventListener("click", function () { if (pos > 4) { pos = 0; paint(); } else step(-1); });

  setInterval(function () {
    if (!playing) return;
    pos += 1;
    if (pos >= dur) { step(1); return; }
    paint();
  }, 1000);

  /* equaliser bars on the playing cover */
  var eqAnims = [];
  function eqTick() {
    eqAnims.forEach(function (a) { a.cancel(); }); eqAnims = [];
    if (!current || !current.el || reduceMotion || !playing) return;
    Array.prototype.forEach.call(current.el.querySelectorAll(".tr-eq i"), function (bar, i) {
      eqAnims.push(bar.animate([{ height: "30%" }, { height: (60 + i * 13) % 100 + "%" }, { height: "45%" }, { height: "100%" }, { height: "30%" }],
        { duration: 900 + i * 170, iterations: Infinity, easing: "ease-in-out" }));
    });
  }

  /* ------------------------------------------------------------------ search filters the wall */
  var q = document.getElementById("q");
  q.addEventListener("input", function () {
    var v = q.value.trim().toLowerCase();
    all.forEach(function (al) {
      var hit = !v || (al.t + " " + al.a).toLowerCase().indexOf(v) > -1;
      al.el.classList.toggle("is-dim", !hit);
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === " " && document.activeElement === document.body) { e.preventDefault(); togglePlay(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tr-chip"), function (c, _, list) {
    c.addEventListener("click", function () { Array.prototype.forEach.call(list, function (x) { x.setAttribute("aria-pressed", x === c); }); });
  });

  /* top bar edge appears once content scrolls under it */
  var bar = document.getElementById("bar");
  addEventListener("scroll", function () { bar.classList.toggle("is-scrolled", scrollY > 4); }, { passive: true });

  setTrack(RECENT[0], true);
  setPlaying(true);
  mountDock();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(mountDock);
})();
</script>
</body>
</html>
