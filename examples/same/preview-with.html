<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== FIXED DESIGN (identical in both versions) ===================== */
*{box-sizing:border-box} html{background:#0c0a14} body{margin:0;min-height:100vh;color:#f6f2ee;font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.scene{position:relative;height:100vh;min-height:720px;overflow:hidden}
#art{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 30% 40%,transparent 50%,rgb(8 6 14/.55))}

.nav{position:absolute;top:20px;left:50%;translate:-50% 0;width:min(1120px,calc(100% - 32px));height:60px;display:flex;align-items:center;gap:28px;padding:0 12px 0 22px;border-radius:999px;z-index:10}
.brand{font:600 20px Fraunces,serif;letter-spacing:-.01em}
.links{display:flex;gap:22px;font-size:14px;margin-left:auto}
.links a{color:inherit;text-decoration:none}
.cta{padding:10px 18px;border-radius:999px;background:#f6f2ee;color:#16121c;font-weight:600;font-size:14px}

.hero{position:absolute;left:max(24px,7vw);top:22vh;max-width:560px;z-index:5}
.hero h1{font:600 clamp(42px,5.4vw,78px)/1.02 Fraunces,serif;letter-spacing:-.02em;margin:0 0 16px;text-shadow:0 2px 30px rgb(0 0 0/.35)}
.hero p{margin:0;font-size:17px;max-width:42ch;text-shadow:0 1px 12px rgb(0 0 0/.4)}

.player{position:absolute;right:max(24px,7vw);top:30vh;width:360px;padding:20px;border-radius:24px;z-index:6;display:grid;gap:12px}
.player .art{display:flex;gap:14px;align-items:center}
.cover{width:64px;height:64px;border-radius:14px;flex:none;background:radial-gradient(circle at 40% 45%,#ffd28a,#ff6b5e 42%,#5b2a8c 80%)}
.player .kicker{font-size:12px;letter-spacing:.04em}
.player h3{margin:2px 0 0;font:600 20px Fraunces,serif}
.player .meta{font-size:13px}
.bar{height:4px;border-radius:2px;background:rgb(255 255 255/.22)}.bar i{display:block;height:100%;width:42%;border-radius:2px;background:#f6f2ee}
.times{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;justify-content:center;align-items:center;gap:26px}
.ctrls button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ctrls .play{width:54px;height:54px;background:#f6f2ee;color:#16121c}

.search{position:absolute;left:max(24px,7vw);bottom:9vh;width:min(640px,calc(100% - 48px));display:flex;align-items:center;gap:6px;padding:8px 8px 8px 22px;border-radius:20px;z-index:6}
.field{flex:1;display:grid;padding:6px 10px}.field+.field{border-left:1px solid rgb(255 255 255/.18)}
.field span{font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.field b{font-weight:500;font-size:15px}
.go{padding:14px 22px;border-radius:14px;background:#ff7a59;color:#1a0f0b;font-weight:600}

.toast{position:absolute;right:max(24px,7vw);bottom:9vh;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;z-index:6;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#7dffb1}

@media (max-width:820px){.links{display:none}.player{top:auto;bottom:calc(9vh + 150px);right:16px;left:16px;width:auto}.hero{top:110px;right:24px}.search{flex-wrap:wrap}.field+.field{border-left:0}.toast{display:none}}
/* ===================== END FIXED DESIGN ===================== */
</style>
<!-- GLASS STYLES: the only part that differs between the two versions -->
<link rel="stylesheet" href="glass-with.css">
</head>
<body>
<main class="scene">
  <canvas id="art" aria-hidden="true"></canvas>
  <div class="vignette"></div>

  <nav class="nav glass-nav" aria-label="Main">
    <span class="brand">Harbor Radio</span>
    <div class="links"><a href="#">Stations</a><a href="#">Shows</a><a href="#">Live</a><a href="#">Library</a></div>
    <button class="cta">Listen now</button>
  </nav>

  <section class="hero">
    <h1>The harbour, live, after dark.</h1>
    <p>Twenty-four hour radio from the lighthouse district: late jazz, field recordings and the night ferry's horn.</p>
  </section>

  <article class="player glass-card" aria-label="Now playing">
    <div class="art"><div class="cover"></div><div><div class="kicker glass-muted">NOW PLAYING · LIVE</div><h3 class="glass-text">Low Tide Sessions</h3><div class="meta glass-muted">with Mara Vell · 22:40</div></div></div>
    <div class="bar"><i></i></div>
    <div class="times glass-muted"><span>18:12</span><span>−24:48</span></div>
    <div class="ctrls"><button aria-label="Back 15 seconds">↺</button><button class="play" aria-label="Pause">❚❚</button><button aria-label="Forward 15 seconds">↻</button></div>
  </article>

  <form class="search glass-search" onsubmit="return false" aria-label="Find a show">
    <label class="field"><span class="glass-muted">Station</span><b class="glass-text">Harbor Jazz</b></label>
    <label class="field"><span class="glass-muted">Tonight</span><b class="glass-text">After 22:00</b></label>
    <button class="go">Find shows</button>
  </form>

  <div class="toast glass-toast" role="status"><span class="dot"></span><span class="glass-text">Recording saved to your library</span></div>
</main>

<script>
// The scene: a harbour town at dusk with lit windows, water and reflections. Fixed seed: identical every load.
const c = document.getElementById("art"), x = c.getContext("2d");
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function draw() {
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = Math.max(innerHeight, 720) * devicePixelRatio; seed = 7;
  const s = devicePixelRatio, sea = H * 0.66;
  let g = x.createLinearGradient(0, 0, 0, sea);
  g.addColorStop(0, "#1b1440"); g.addColorStop(.45, "#6b3a78"); g.addColorStop(.8, "#ff8a5c"); g.addColorStop(1, "#ffc98a");
  x.fillStyle = g; x.fillRect(0, 0, W, sea);
  const sx = W * .62, sy = sea - 40 * s;
  g = x.createRadialGradient(sx, sy, 0, sx, sy, 380 * s); g.addColorStop(0, "rgba(255,236,190,.95)"); g.addColorStop(.12, "rgba(255,200,140,.75)"); g.addColorStop(1, "rgba(255,140,90,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 9; i++) { x.fillStyle = `rgba(255,${180 + rnd() * 50},${150 + rnd() * 60},${.18 + rnd() * .2})`; const cy = sea * (.12 + rnd() * .5), cx = rnd() * W; x.beginPath(); x.ellipse(cx, cy, (160 + rnd() * 260) * s, (6 + rnd() * 10) * s, 0, 0, 7); x.fill(); }
  // hills
  x.fillStyle = "#3a2350"; x.beginPath(); x.moveTo(0, sea); for (let X = 0; X <= W; X += 20 * s) x.lineTo(X, sea - (60 + 50 * Math.sin(X / (180 * s)) + 30 * Math.sin(X / (61 * s))) * s); x.lineTo(W, sea); x.fill();
  // town
  for (let i = 0; i < 260; i++) {
    const bx = rnd() * W, bw = (14 + rnd() * 34) * s, bh = (30 + rnd() * 120) * s * (1 - Math.abs(bx / W - .45) * .7);
    const by = sea - bh + rnd() * 10 * s;
    x.fillStyle = `hsl(${270 + rnd() * 30} ${25 + rnd() * 15}% ${14 + rnd() * 10}%)`; x.fillRect(bx, by, bw, bh + 4 * s);
    x.fillStyle = "#2a1838"; x.beginPath(); x.moveTo(bx - 2 * s, by); x.lineTo(bx + bw / 2, by - 10 * s); x.lineTo(bx + bw + 2 * s, by); x.fill();
    for (let wy = by + 6 * s; wy < sea - 6 * s; wy += 11 * s) for (let wx = bx + 4 * s; wx < bx + bw - 5 * s; wx += 9 * s) if (rnd() < .42) { x.fillStyle = `rgba(255,${190 + rnd() * 50},${110 + rnd() * 60},${.55 + rnd() * .45})`; x.fillRect(wx, wy, 4 * s, 5 * s); }
  }
  // lighthouse
  const lx = W * .83; x.fillStyle = "#efe6e0"; x.fillRect(lx, sea - 190 * s, 22 * s, 190 * s); x.fillStyle = "#c2423a"; for (let k = 0; k < 4; k++) x.fillRect(lx, sea - (40 + k * 45) * s, 22 * s, 14 * s);
  g = x.createRadialGradient(lx + 11 * s, sea - 196 * s, 0, lx + 11 * s, sea - 196 * s, 120 * s); g.addColorStop(0, "rgba(255,250,220,1)"); g.addColorStop(1, "rgba(255,240,200,0)"); x.fillStyle = g; x.fillRect(lx - 120 * s, sea - 320 * s, 260 * s, 260 * s);
  // sea + reflections
  g = x.createLinearGradient(0, sea, 0, H); g.addColorStop(0, "#5a3466"); g.addColorStop(1, "#120d22"); x.fillStyle = g; x.fillRect(0, sea, W, H - sea);
  for (let y = sea + 2 * s; y < H; y += (3 + (y - sea) / (60 * s)) * s) {
    const k = (y - sea) / (H - sea), w = (90 + k * 520) * s;
    x.fillStyle = `rgba(255,210,150,${.5 * (1 - k)})`; x.fillRect(sx - w / 2 + (rnd() - .5) * 60 * s, y, w * (.3 + rnd() * .7), 2 * s);
    if (rnd() < .5) { x.fillStyle = `rgba(255,200,140,${.25 * (1 - k)})`; x.fillRect(rnd() * W, y, (20 + rnd() * 80) * s, 1.5 * s); }
  }
  // boats
  for (let i = 0; i < 7; i++) { const bx = rnd() * W, by = sea + (30 + rnd() * 160) * s, bw = (40 + rnd() * 50) * s; x.fillStyle = "#15101f"; x.beginPath(); x.moveTo(bx, by); x.lineTo(bx + bw, by); x.lineTo(bx + bw * .85, by + 10 * s); x.lineTo(bx + bw * .12, by + 10 * s); x.fill(); x.fillStyle = "rgba(255,220,160,.9)"; x.fillRect(bx + bw * .5, by - 5 * s, 4 * s, 4 * s); }
}
draw(); addEventListener("resize", draw);
</script>
</body>
</html>
